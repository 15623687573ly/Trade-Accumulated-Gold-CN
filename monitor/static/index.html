<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f2">
<title>积存金看板</title>
<style>
/* ── 设计令牌：界面色（金色主题只用于导航/按钮）与数据色（图表系列）分开 ── */
:root {
  color-scheme: light;
  --bg: #f6f5f2; --surface: #fffefc; --surface-2: #f1efea; --border: #e6e3dc; --grid: #ece9e3;
  --text: #121212; --text-2: #54524d; --text-3: #85837d;
  --brand: #9a6b12; --brand-soft: #f6ead2; --on-brand: #ffffff;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100; --series-5: #e87ba4; --series-6: #008300;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --bg: #101010; --surface: #1a1a19; --surface-2: #232321; --border: #2f2f2c; --grid: #282826;
    --text: #f0efec; --text-2: #c3c2b7; --text-3: #8f8e88;
    --brand: #e0a94a; --brand-soft: #3a2f1a; --on-brand: #1a1408;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500; --series-5: #d55181; --series-6: #008300;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #101010; --surface: #1a1a19; --surface-2: #232321; --border: #2f2f2c; --grid: #282826;
  --text: #f0efec; --text-2: #c3c2b7; --text-3: #8f8e88;
  --brand: #e0a94a; --brand-soft: #3a2f1a; --on-brand: #1a1408;
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500; --series-5: #d55181; --series-6: #008300;
  --shadow: none;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  font-variant-numeric: tabular-nums;
}
button { font: inherit; color: inherit; }
a { color: var(--brand); }

/* ── 布局 ── */
.app-header {
  position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--border);
}
.header-inner { max-width: 1120px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
.logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; white-space: nowrap; }
.logo-mark { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg, #f3c768, #b7861f); box-shadow: inset 0 -2px 0 rgba(0,0,0,.15); }
.header-meta { margin-left: auto; display: flex; align-items: center; gap: 8px; min-width: 0; }
.updated { color: var(--text-3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; display: grid; place-items: center; flex: none; }
.icon-btn:focus-visible, .tab:focus-visible, .seg button:focus-visible, .chip-btn:focus-visible, summary:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

.tabs-top { display: none; }
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: space-around;
  background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--border); padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
}
.tab {
  flex: 1; border: 0; background: none; cursor: pointer; padding: 4px 0; border-radius: 10px;
  display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--text-3); font-size: 11px;
}
.tab svg { width: 22px; height: 22px; }
.tab[aria-selected="true"] { color: var(--brand); font-weight: 600; }
main { max-width: 1120px; margin: 0 auto; padding: 16px 16px calc(84px + env(safe-area-inset-bottom)); }
@media (min-width: 820px) {
  .tabbar { display: none; }
  .tabs-top { display: flex; gap: 4px; margin-left: 20px; }
  .tabs-top .tab { flex: none; flex-direction: row; font-size: 14px; padding: 7px 14px; gap: 6px; white-space: nowrap; }
  .tabs-top .tab svg { width: 18px; height: 18px; }
  .tabs-top .tab[aria-selected="true"] { background: var(--brand-soft); }
  main { padding-bottom: 32px; }
}
.panel[hidden] { display: none; }
.stack { display: grid; gap: 14px; }
.grid-2 { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 820px) { .grid-2 { grid-template-columns: 1fr 1fr; } .span-2 { grid-column: 1 / -1; } }

/* ── 卡片与通用元素 ── */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.card-title { font-size: 15px; font-weight: 650; margin: 0; }
.sub { color: var(--text-3); font-size: 12.5px; }
.muted { color: var(--text-3); }
.secondary { color: var(--text-2); }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--text-2); white-space: nowrap; }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 11px; padding: 1px 7px; border-radius: 6px; border: 1px solid var(--border); color: var(--text-2); white-space: nowrap; }
.tag.ai { border-color: color-mix(in srgb, var(--brand) 45%, var(--border)); color: var(--brand); }
.swatch { display: inline-block; width: 12px; height: 3px; border-radius: 2px; flex: none; }
.notice { border-radius: 10px; padding: 10px 12px; background: var(--surface-2); font-size: 13.5px; border-left: 3px solid var(--text-3); }
.notice.warn { border-left-color: var(--warning); }
.notice.good { border-left-color: var(--good); }
.notice.info { border-left-color: var(--brand); }
.empty { color: var(--text-3); font-size: 14px; padding: 22px 0; text-align: center; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 14px; }
.kv .k { color: var(--text-3); white-space: nowrap; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 9px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 4px 12px; color: var(--text-2); font-size: 13px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--brand); color: var(--on-brand); }
.link-btn { border: 0; background: none; color: var(--brand); cursor: pointer; padding: 0; font-size: 13.5px; }
details > summary { cursor: pointer; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
.more > summary { color: var(--text-2); font-size: 13px; margin-top: 10px; }
.more > summary::before { content: "▸ "; color: var(--text-3); }
.more[open] > summary::before { content: "▾ "; }
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: right; padding: 8px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th { color: var(--text-3); font-weight: 500; font-size: 12px; }
th:first-child, td:first-child { text-align: left; padding-left: 0; }
th:last-child, td:last-child { padding-right: 0; }
td.wrap, th.wrap { white-space: normal; text-align: left; }
.list { list-style: none; padding: 0; margin: 0; }
.list > li { padding: 10px 0; border-bottom: 1px solid var(--grid); }
.list > li:last-child { border-bottom: 0; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row .grow { flex: 1; min-width: 0; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ── 总览 ── */
.hero { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 560px) { .hero { grid-template-columns: 1.1fr 1fr; align-items: end; } }
.price-big { font-size: 38px; font-weight: 700; letter-spacing: -.5px; line-height: 1.1; }
.delta { font-size: 14px; font-weight: 600; }
.mini-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
.mini-stat { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; min-width: 0; }
.mini-stat .l { font-size: 11.5px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini-stat .v { font-size: 16px; font-weight: 650; }
.action-label { font-size: 22px; font-weight: 700; }
.action-zone { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 8px; margin-top: 12px; }
.ai-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13.5px; }

/* ── 策略 ── */
.legend { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.chip-btn { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text-2); cursor: pointer; }
.chip-btn[aria-pressed="false"] { opacity: .45; }
.chip-btn[aria-pressed="false"] .swatch { background: var(--text-3) !important; }
.filter-btn { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text-2); cursor: pointer; }
.filter-btn[aria-pressed="true"] { background: var(--brand-soft); border-color: var(--brand); color: var(--text); font-weight: 600; }
.filter-btn:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.strategy { border-bottom: 1px solid var(--grid); }
.strategy:last-child { border-bottom: 0; }
.strategy > summary { padding: 12px 0; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center; }
.strategy .name { font-weight: 600; display: flex; align-items: center; gap: 8px; min-width: 0; }
.strategy .ret { font-size: 18px; font-weight: 700; text-align: right; }
.strategy .meta { color: var(--text-3); font-size: 12.5px; }
.strategy .value { color: var(--text-3); font-size: 12.5px; text-align: right; }
.strategy .body { padding: 0 0 12px 20px; font-size: 13.5px; }
.rank { width: 20px; color: var(--text-3); font-size: 12px; flex: none; }

/* ── AI ── */
.bias { font-weight: 700; }
.bar { height: 6px; border-radius: 3px; background: var(--grid); overflow: hidden; position: relative; }
.bar > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--text-2); }
.bar .mid { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--text-3); }
.hz { padding: 12px 0; border-bottom: 1px solid var(--grid); }
.hz:last-child { border-bottom: 0; }
.hz-row { display: grid; grid-template-columns: 64px 1fr 92px; gap: 10px; align-items: center; font-size: 13.5px; margin-top: 6px; }

/* ── 图表 ── */
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; overflow: visible; }
.tooltip {
  position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 8px 10px; font-size: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.14);
  min-width: 150px; display: none; z-index: 5;
}
.tooltip .trow { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.tooltip .trow > span { white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.foot { text-align: center; color: var(--text-3); font-size: 12px; padding: 18px 0 4px; }
</style>
</head>
<body>
<header class="app-header">
  <div class="header-inner">
    <div class="logo"><span class="logo-mark" aria-hidden="true"></span>积存金看板</div>
    <nav class="tabs-top" role="tablist" aria-label="页面" id="tabs-top"></nav>
    <div class="header-meta">
      <span class="chip" id="market-chip"><span class="dot" style="background:var(--text-3)"></span>加载中</span>
      <span class="updated" id="updated"></span>
      <button class="icon-btn" id="theme-btn" type="button" aria-label="切换深浅色" title="切换深浅色"></button>
    </div>
  </div>
</header>

<main>
  <section class="panel stack" id="panel-overview" role="tabpanel" aria-label="总览"></section>
  <section class="panel stack" id="panel-strategies" role="tabpanel" aria-label="策略" hidden></section>
  <section class="panel stack" id="panel-ai" role="tabpanel" aria-label="AI" hidden></section>
  <section class="panel stack" id="panel-market" role="tabpanel" aria-label="行情" hidden></section>
  <section class="panel stack" id="panel-records" role="tabpanel" aria-label="记录" hidden></section>
  <div class="foot">模拟盘为虚拟交易，不构成投资建议 · 每 60 秒自动刷新</div>
</main>

<nav class="tabbar" role="tablist" aria-label="页面" id="tabbar"></nav>

<script>
"use strict";
/* ── 常量与格式化 ───────────────────────────────────────────────────── */
const SERIES_SLOT = { hold: 1, dca: 2, dca_smart: 3, position: 4, dca_smart_ai: 5, position_ai: 6 };
const BIAS = { bullish: "偏多", bearish: "偏空", neutral: "中性" };
const CONF = { low: "低", medium: "中", high: "高" };
const ACTION = { buy_on_dip: "回落低吸", wait: "观望", reduce_only: "只减仓" };
const ANALYST = { claude: "Claude", codex: "Codex" };
const SOURCE_TEXT = { claude: "Claude", codex: "Codex", consensus: "两者共识" };
const ICONS = {
  overview: '<path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
  strategies: '<path d="M4 19V9m6 10V5m6 14v-7m4 7H2"/>',
  ai: '<path d="M12 3v3m0 12v3m9-9h-3M6 12H3m14.5-6.5-2 2m-7 7-2 2m11 0-2-2m-7-7-2-2"/><circle cx="12" cy="12" r="3.2"/>',
  market: '<path d="M3 17l5-6 4 3 6-8 3 4"/><path d="M3 21h18"/>',
  records: '<path d="M6 3h9l4 4v14H6z"/><path d="M9 11h7M9 15h7M9 7h3"/>',
};
const EVENT_CN = {
  "Inflation Rate YoY": "CPI 年率", "Inflation Rate MoM": "CPI 月率", "Core Inflation Rate YoY": "核心 CPI 年率", "Core Inflation Rate MoM": "核心 CPI 月率",
  "PPI MoM": "PPI 月率", "PPI YoY": "PPI 年率", "Core PCE Price Index MoM": "核心 PCE 月率", "Core PCE Price Index YoY": "核心 PCE 年率",
  "Non Farm Payrolls": "非农就业人数", "Unemployment Rate": "失业率", "Fed Interest Rate Decision": "美联储利率决议", "Fed Press Conference": "美联储新闻发布会",
  "FOMC Economic Projections": "FOMC 经济预测", "FOMC Minutes": "FOMC 会议纪要", "Retail Sales MoM": "零售销售月率", "Retail Sales YoY": "社会消费品零售年率",
  "GDP Growth Rate YoY": "GDP 年率", "GDP Growth Rate QoQ Adv": "GDP 季率初值", "GDP Growth Rate QoQ Final": "GDP 季率终值", "Industrial Production YoY": "工业增加值年率",
  "Building Permits Prel": "营建许可初值", "Housing Starts": "新屋开工", "Existing Home Sales": "成屋销售", "Durable Goods Orders MoM": "耐用品订单月率",
  "ISM Manufacturing PMI": "ISM 制造业 PMI", "ISM Services PMI": "ISM 服务业 PMI", "JOLTs Job Openings": "JOLTs 职位空缺", "Michigan Consumer Sentiment Prel": "密歇根消费者信心初值",
  "Personal Income MoM": "个人收入月率", "Personal Spending MoM": "个人支出月率",
};
const eventName = (t) => EVENT_CN[t] || (/^Fed Chair (.+) Speech$/.test(t) ? `美联储主席${t.replace(/^Fed Chair (.+) Speech$/, " $1 ")}讲话` : t);
const COUNTRY_CN = { US: "美国", CN: "中国" };
const TABS = [["overview", "总览"], ["strategies", "策略"], ["ai", "AI"], ["market", "行情"], ["records", "记录"]];

const bjFmt = new Intl.DateTimeFormat("zh-CN", { timeZone: "Asia/Shanghai", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false });
const bjTime = new Intl.DateTimeFormat("zh-CN", { timeZone: "Asia/Shanghai", hour: "2-digit", minute: "2-digit", hour12: false });
const fmtTs = (s) => s ? bjFmt.format(new Date(s)).replace(/\//g, "-") : "—";
const num = (v, d = 2) => (v === null || v === undefined || Number.isNaN(v)) ? "—" : Number(v).toLocaleString("zh-CN", { minimumFractionDigits: d, maximumFractionDigits: d });
const signed = (v, d = 2) => (v === null || v === undefined) ? "—" : (v > 0 ? "+" : v < 0 ? "−" : "") + num(Math.abs(v), d);
const pct = (v, d = 2) => (v === null || v === undefined) ? "—" : (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v * 100).toFixed(d) + "%";
const rate = (v) => v === null || v === undefined ? "—" : Math.round(v * 100) + "%";
const seriesColor = (key) => `var(--series-${SERIES_SLOT[key] || 1})`;
const arrow = (v) => v > 0 ? "▲" : v < 0 ? "▼" : "■";

function el(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") node.className = v;
    else if (k === "style") node.setAttribute("style", v);
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat()) {
    if (c === null || c === undefined || c === false) continue;
    node.appendChild(typeof c === "string" || typeof c === "number" ? document.createTextNode(String(c)) : c);
  }
  return node;
}
const svgEl = (tag, attrs = {}) => { const n = document.createElementNS("http://www.w3.org/2000/svg", tag); for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v); return n; };
const clear = (node) => { while (node.firstChild) node.removeChild(node.firstChild); return node; };
const icon = (name) => { const s = svgEl("svg", { viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", "stroke-width": 1.8, "stroke-linecap": "round", "stroke-linejoin": "round", "aria-hidden": "true" }); s.innerHTML = ICONS[name]; return s; };
const card = (title, sub, ...body) => el("div", { class: "card" }, (title || sub) ? el("div", { class: "card-head" }, title ? el("h2", { class: "card-title" }, title) : null, sub || null) : null, ...body);
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* 隐私模式 */ } } };

/* ── 主题 ───────────────────────────────────────────────────────────── */
const THEME_ICON = { auto: "◐", light: "☀", dark: "☾" };
function applyTheme(mode) {
  if (mode === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = mode;
  const btn = document.getElementById("theme-btn");
  btn.textContent = THEME_ICON[mode];
  btn.setAttribute("aria-label", `主题：${{ auto: "跟随系统", light: "浅色", dark: "深色" }[mode]}，点击切换`);
  const dark = mode === "dark" || (mode === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#101010" : "#f6f5f2");
}
let themeMode = store.get("gold-theme") || "auto";
applyTheme(themeMode);
document.getElementById("theme-btn").addEventListener("click", () => {
  themeMode = { auto: "light", light: "dark", dark: "auto" }[themeMode];
  store.set("gold-theme", themeMode); applyTheme(themeMode); renderActiveCharts();
});

/* ── 标签页 ─────────────────────────────────────────────────────────── */
let activeTab = (location.hash.slice(1) || store.get("gold-tab") || "overview");
if (!TABS.some(([id]) => id === activeTab)) activeTab = "overview";
function buildTabs() {
  for (const host of [document.getElementById("tabbar"), document.getElementById("tabs-top")]) {
    for (const [id, label] of TABS) {
      host.appendChild(el("button", { class: "tab", role: "tab", type: "button", "data-tab": id, "aria-controls": `panel-${id}`,
        onclick: () => showTab(id) }, icon(id), el("span", {}, label)));
    }
  }
}
function showTab(id, push = true) {
  activeTab = id; store.set("gold-tab", id);
  if (push) history.replaceState(null, "", "#" + id);
  document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-selected", String(t.dataset.tab === id)));
  TABS.forEach(([tid]) => { document.getElementById(`panel-${tid}`).hidden = tid !== id; });
  renderActiveCharts();
  window.scrollTo({ top: 0 });
}
window.addEventListener("hashchange", () => { const id = location.hash.slice(1); if (TABS.some(([t]) => t === id)) showTab(id, false); });

/* ── 图表：折线（共享 Y 轴、十字线汇总提示）与迷你走势 ─────────────── */
function lineChart(container, { series, yFormat, tipFormat, refLines = [], height = 240, emptyText, zeroLine = false }) {
  clear(container);
  tipFormat = tipFormat || yFormat;
  const visible = series.filter((s) => s.points.length);
  const pts = visible.flatMap((s) => s.points);
  if (pts.length < 2) { container.appendChild(el("div", { class: "empty" }, emptyText || "数据积累中")); return; }
  const width = Math.max(container.clientWidth, 260);
  const m = { top: 10, right: 8, bottom: 24, left: 52 };
  const xs = pts.map((p) => +new Date(p[0]));
  let x0 = Math.min(...xs), x1 = Math.max(...xs);
  if (x0 === x1) { x0 -= 3600e3; x1 += 3600e3; }
  const yVals = pts.map((p) => p[1]).concat(refLines.map((r) => r.value)).concat(zeroLine ? [0] : []);
  let y0 = Math.min(...yVals), y1 = Math.max(...yVals);
  const pad = (y1 - y0) * 0.1 || Math.abs(y1) * 0.002 || 0.001;
  y0 -= pad; y1 += pad;
  const X = (t) => m.left + (t - x0) / (x1 - x0) * (width - m.left - m.right);
  const Y = (v) => m.top + (1 - (v - y0) / (y1 - y0)) * (height - m.top - m.bottom);
  const svg = svgEl("svg", { viewBox: `0 0 ${width} ${height}`, height, role: "img" });
  for (let i = 0; i <= 4; i++) {
    const v = y0 + (y1 - y0) * i / 4, y = Y(v);
    svg.appendChild(svgEl("line", { x1: m.left, x2: width - m.right, y1: y, y2: y, stroke: "var(--grid)", "stroke-width": 1 }));
    const t = svgEl("text", { x: m.left - 8, y: y + 4, "text-anchor": "end", "font-size": 11, fill: "var(--text-3)" });
    t.textContent = yFormat(v); svg.appendChild(t);
  }
  for (let i = 0; i <= 3; i++) {
    const t0 = x0 + (x1 - x0) * i / 3;
    const t = svgEl("text", { x: X(t0), y: height - 5, "text-anchor": i === 0 ? "start" : i === 3 ? "end" : "middle", "font-size": 11, fill: "var(--text-3)" });
    t.textContent = (x1 - x0) > 36 * 3600e3 ? fmtTs(t0).slice(0, 5) : bjTime.format(new Date(t0)); svg.appendChild(t);
  }
  if (zeroLine && y0 < 0 && y1 > 0) svg.appendChild(svgEl("line", { x1: m.left, x2: width - m.right, y1: Y(0), y2: Y(0), stroke: "var(--text-3)", "stroke-width": 1 }));
  let last = null;
  for (const r of refLines.filter((r) => r.value >= y0 && r.value <= y1).sort((a, b) => b.value - a.value)) {
    svg.appendChild(svgEl("line", { x1: m.left, x2: width - m.right, y1: Y(r.value), y2: Y(r.value), stroke: "var(--text-3)", "stroke-width": 1, "stroke-dasharray": "4 4" }));
    if (last && Y(r.value) - last.y < 14) { last.node.textContent += " · " + r.label; continue; }
    const t = svgEl("text", { x: width - m.right - 2, y: Y(r.value) - 4, "text-anchor": "end", "font-size": 11, fill: "var(--text-2)" });
    t.textContent = r.label; svg.appendChild(t); last = { y: Y(r.value), node: t };
  }
  for (const s of visible) {
    const d = s.points.map((p, i) => `${i ? "L" : "M"}${X(+new Date(p[0])).toFixed(1)},${Y(p[1]).toFixed(1)}`).join("");
    svg.appendChild(svgEl("path", { d, fill: "none", stroke: s.color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
  }
  const cross = svgEl("line", { y1: m.top, y2: height - m.bottom, stroke: "var(--text-3)", "stroke-width": 1, visibility: "hidden" });
  svg.appendChild(cross);
  const dots = visible.map((s) => { const c = svgEl("circle", { r: 4, fill: s.color, stroke: "var(--surface)", "stroke-width": 2, visibility: "hidden" }); svg.appendChild(c); return c; });
  const hit = svgEl("rect", { x: m.left, y: 0, width: width - m.left - m.right, height, fill: "transparent" });
  svg.appendChild(hit);
  container.appendChild(svg);
  const tip = el("div", { class: "tooltip", role: "status" }); container.appendChild(tip);
  const nearest = (arr, t) => {
    let lo = 0, hi = arr.length - 1;
    while (hi - lo > 1) { const mid = (lo + hi) >> 1; (+new Date(arr[mid][0]) < t) ? lo = mid : hi = mid; }
    return Math.abs(+new Date(arr[lo][0]) - t) <= Math.abs(+new Date(arr[hi][0]) - t) ? arr[lo] : arr[hi];
  };
  const move = (evt) => {
    const rect = svg.getBoundingClientRect();
    const px = (evt.clientX - rect.left) * width / rect.width;
    const t = x0 + (Math.min(Math.max(px, m.left), width - m.right) - m.left) / (width - m.left - m.right) * (x1 - x0);
    let snapT = null; const rows = [];
    visible.forEach((s, i) => {
      const p = nearest(s.points, t); snapT = snapT ?? +new Date(p[0]);
      dots[i].setAttribute("cx", X(+new Date(p[0]))); dots[i].setAttribute("cy", Y(p[1])); dots[i].setAttribute("visibility", "visible");
      rows.push({ name: s.name, color: s.color, v: p[1] });
    });
    cross.setAttribute("x1", X(snapT)); cross.setAttribute("x2", X(snapT)); cross.setAttribute("visibility", "visible");
    clear(tip);
    tip.appendChild(el("div", { class: "muted" }, fmtTs(snapT)));
    rows.sort((a, b) => b.v - a.v).forEach((r) => tip.appendChild(el("div", { class: "trow" },
      el("span", {}, el("span", { class: "swatch", style: `background:${r.color}` }), r.name), el("strong", {}, tipFormat(r.v)))));
    tip.style.display = "block";
    const left = X(snapT) / width * rect.width;
    tip.style.left = (left + 12 + tip.offsetWidth > rect.width ? left - tip.offsetWidth - 12 : left + 12) + "px";
    tip.style.top = "4px";

  const leave = () => { tip.style.display = "none"; cross.setAttribute("visibility", "hidden"); dots.forEach((d) => d.setAttribute("visibility", "hidden")); };
  hit.addEventListener("pointermove", move); hit.addEventListener("pointerdown", move); hit.addEventListener("pointerleave", leave);
}

function sparkline(container, points, height = 56) {
  clear(container);

  const d = points.map((p, i) => `${i ? "L" : "M"}${X(+new Date(p[0])).toFixed(1)},${Y(p[1]).toFixed(1)}`).join("");
  const svg = svgEl("svg", { viewBox: `0 0 ${width} ${height}`, height, role: "img", "aria-label": "近 24 小时走势" });

async function load() {
  try {
    const r = await fetch("/api/dashboard", { cache: "no-store", credentials: "same-origin" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    DATA = await r.json();
    render();
  } catch (e) {
    document.getElementById("updated").textContent = "加载失败，稍后重试";
  }
}
